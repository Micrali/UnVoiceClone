<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>音频防御 - UnVC</title><link rel="stylesheet" href="styles.css"><script src="components.js"></script></head><body class="macaron-page"><script>renderHeader('audio')</script><main class="container corner-wrap"><script>breadcrumb('音频防御')</script><section class="page-heading"><h1>音频防御</h1><p>此功能可针对用户上传的音频进行 UnVC 防御保护，处理后音频在人耳听感上基本一致，但可扰乱声纹模型特征提取，防止其生成具有高相似度的克隆语音。</p></section><section class="cards-two"><div class="function-card"><h3>原始音频</h3><p>固定演示输入：original_voice_demo.wav，时长 12.4s，采样率 16kHz。</p><div class="wave-box"></div><div class="card-actions"><button class="btn btn-secondary">上传音频</button><button class="btn btn-primary">播放原始音频</button></div></div><div class="flow-badge">UnVC防御</div><div class="function-card"><h3>防御后音频</h3><p>固定演示输出：unvc_defended_voice.wav，完成身份替换、扰动优化与保真约束。</p><div class="wave-box dark"></div><div class="card-actions"><button class="btn btn-primary" onclick="defend('audio')">开始防御</button><button class="btn btn-secondary">下载音频</button></div></div></section><section class="metrics-grid"><div class="metric-card"><div class="metric-value">84.73%</div><div class="metric-label">语音保真相似度</div></div><div class="metric-card"><div class="metric-value">66.29%</div><div class="metric-label">黑盒防御成功率</div></div><div class="metric-card"><div class="metric-value">60.04%</div><div class="metric-label">抗压缩防御成功率</div></div></section><div class="result-box" id="result"><strong>处理结果：</strong><br>点击“开始防御”后将展示输入文件、输出文件、处理耗时和防御评估结论。</div></main><script src="app.js"></script></body></html>

<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>控制台 - UnVC</title><link rel="stylesheet" href="styles.css"><script src="components.js"></script></head><body><script>renderHeader('dashboard')</script><main class="page-shell corner-wrap"><div class="page-ornament-headphone">🎧</div><div class="page-ornament-glasses">⌁</div><div class="page-ornament-dot"></div><script>breadcrumb('控制台')</script><section class="page-heading"><h1>系统控制台</h1><p>固定演示数据用于页面截图展示，体现系统处理能力、防御成功率与历史任务结果。</p></section><section class="dashboard-grid"><div class="metric-card"><div id="totalFiles" class="metric-value">--</div><div class="metric-label">累计防御文件数</div></div><div class="metric-card"><div id="todayFiles" class="metric-value">--</div><div class="metric-label">今日处理数</div></div><div class="metric-card"><div id="successRate" class="metric-value">--</div><div class="metric-label">平均防御成功率</div></div><div class="metric-card"><div id="avgDuration" class="metric-value">--</div><div class="metric-label">平均处理时长</div></div><div class="metric-card"><div id="availability" class="metric-value">--</div><div class="metric-label">系统可用性</div></div><div class="metric-card"><div id="riskBlocks" class="metric-value">--</div><div class="metric-label">拦截克隆风险次数</div></div></section><div class="result-box" id="sysState">系统状态加载中...</div><div class="table-wrap"><table class="data-table"><thead><tr><th>文件名</th><th>类型</th><th>处理时长</th><th>处理时间</th><th>结果</th></tr></thead><tbody id="records"></tbody></table></div></main><script src="app.js"></script></body></html>

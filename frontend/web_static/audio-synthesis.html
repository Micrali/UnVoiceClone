<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>音频合成测试 - UnVC</title><link rel="stylesheet" href="styles.css"><script src="components.js"></script></head><body class="macaron-page"><script>renderHeader('synthesis')</script><main class="container corner-wrap"><script>breadcrumb('音频合成测试')</script><section class="page-heading"><h1>音频合成测试</h1><p>此功能用于测试文本到语音合成场景下的防御效果。攻击者输入任意文本并尝试基于防御后目标音色进行合成，系统将展示合成相似度与目标音色保护结论。</p></section><section class="demo-grid-three"><div class="test-card"><h3>输入文本</h3><p>您好，这是一段用于验证 UnVoiceClone 主动防御效果的测试文本。</p><button class="btn btn-secondary">修改文本</button></div><div class="test-card"><h3>目标音色音频</h3><p>默认目标音色：defended_target_demo.wav，用于模拟 TTS 模型参考音色。</p><button class="btn btn-secondary">上传文件</button><br><br><button class="btn btn-primary" onclick="runTest('synthesis')">开始合成</button></div><div class="test-card"><h3>合成结果</h3><p>默认输出：synthesis_result_demo.wav，展示合成相似度下降效果。</p><div class="result-box" id="synthesisResult"><strong>测试结果：</strong><br>点击“开始合成”后展示文本合成测试结果。</div></div></section></main><script src="app.js"></script></body></html>

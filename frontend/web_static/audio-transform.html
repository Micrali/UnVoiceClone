<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>音频转换测试 - UnVC</title><link rel="stylesheet" href="styles.css"><script src="components.js"></script></head><body class="macaron-page"><script>renderHeader('transform')</script><main class="container corner-wrap"><script>breadcrumb('音频转换测试')</script><section class="page-heading"><h1>音频转换测试</h1><p>此功能用于测试音频转换攻击下的防御效果。您可以在“原始音频”中上传需要被转换的音频，在“目标音色音频”中上传 UnVC 防御后的音频，经过音频转换功能，体验对抗生成的防御效果。</p></section><section class="demo-grid-three"><div class="test-card"><h3>原始音频</h3><p>演示输入：speaker_source_demo.wav，用于模拟攻击者的源语音样本。</p><button class="btn btn-secondary">上传文件</button></div><div class="test-card"><h3>目标音色音频</h3><p>演示输入：defended_target_demo.wav，由 UnVC 防御流程输出得到。</p><button class="btn btn-secondary">上传文件</button><br><br><button class="btn btn-primary" onclick="runTest('transform')">音频转换</button></div><div class="test-card"><h3>转换音频</h3><p>固定演示输出：clone_result_demo.wav，用于展示克隆相似度下降结果。</p><div class="result-box" id="transformResult"><strong>测试结果：</strong><br>点击“音频转换”后展示克隆前后相似度对比。</div></div></section></main><script src="app.js"></script></body></html>
